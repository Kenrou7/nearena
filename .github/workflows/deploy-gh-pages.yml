name: Deploy Web To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web static export
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_NEAR_CONTRACT_ID: ${{ vars.NEXT_PUBLIC_NEAR_CONTRACT_ID }}
          NEXT_PUBLIC_NEAR_NETWORK_ID: ${{ vars.NEXT_PUBLIC_NEAR_NETWORK_ID }}
          NEXT_PUBLIC_NEAR_RPC_PROXY_PATH: ${{ vars.NEXT_PUBLIC_NEAR_RPC_PROXY_PATH }}
          NEXT_PUBLIC_SOLANA_NETWORK: ${{ vars.NEXT_PUBLIC_SOLANA_NETWORK }}
        run: |
          test -n "$NEXT_PUBLIC_BACKEND_URL" || (echo "Missing NEXT_PUBLIC_BACKEND_URL" && exit 1)
          test -n "$NEXT_PUBLIC_NEAR_CONTRACT_ID" || (echo "Missing NEXT_PUBLIC_NEAR_CONTRACT_ID" && exit 1)
          test -n "$NEXT_PUBLIC_NEAR_NETWORK_ID" || (echo "Missing NEXT_PUBLIC_NEAR_NETWORK_ID" && exit 1)
          test -n "$NEXT_PUBLIC_NEAR_RPC_PROXY_PATH" || (echo "Missing NEXT_PUBLIC_NEAR_RPC_PROXY_PATH" && exit 1)
          npm run build --workspace @gladiator/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
